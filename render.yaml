services:
  - type: web
    name: booking-ruang-rapat-mrdk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Database dipindah ke Neon (9 Nov 2026). Nilainya diisi manual di Render → Environment.
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: APP_TIME_ZONE
        value: Asia/Jakarta

# Database Render lama (paket gratis, kedaluwarsa 15 Nov 2026) tidak lagi dipakai aplikasi.
# Blok ini boleh dihapus setelah database tersebut dihapus dari dashboard Render.
databases:
  - name: booking-ruang-rapat-db
    plan: free
    region: singapore
    databaseName: booking_ruang_rapat
    ipAllowList: []
